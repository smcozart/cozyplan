# The enforcement layer from ADR-0004: hooks advise, CI enforces.
# Local hooks fire only for the agent, on one machine, and .git/hooks is not
# cloned — so this workflow is the only check a contributor cannot route around.
# Making it *required* still needs a human with repo admin (Settings → Branches);
# until that is done this reports without gating, and says so rather than
# implying protection that is not there.
name: state check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # state check walks history: `merge-base --is-ancestor` and
          # `rev-list --count` both need the commit STATE.md names to be present.
          # A shallow clone makes every snapshot look like an unknown commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test suite
        run: python -m pytest tests -q

      - name: Plans validate
        run: |
          shopt -s nullglob
          for plan in specs/*.html; do
            case "$plan" in *_index*) continue;; esac
            python skills/cozyplan/scripts/plan_tool.py validate "$plan"
          done

      - name: Generated files are current
        # specs/_index.* is generated and committed. Regenerating must be a no-op;
        # a diff here means someone hand-edited an aggregate or forgot to rerun the
        # builder. This is how the index sat stale on a pre-rename title.
        run: |
          python skills/cozyplan/scripts/plan_tool.py index --specs specs
          if ! git diff --quiet -- specs/_index.json specs/_index.html; then
            echo "::error::specs/_index.* is out of date — run: plan_tool index --specs specs"
            git --no-pager diff -- specs/_index.json specs/_index.html
            exit 1
          fi

      - name: State check
        # No --max-drift: on a pull request STATE.md is always behind HEAD by at
        # least that PR's commits, so failing on drift would make this unusable.
        # Drift is reported; only structural problems fail (ADR-0004 gap tolerance).
        run: python skills/cozyplan/scripts/plan_tool.py state check
